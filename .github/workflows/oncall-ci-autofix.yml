name: Oncall CI 자동 수정

# 트리거: 사람이 아니라 "CI" 워크플로우(lint/build/test)의 실패 그 자체.
# workflow_run은 base repo 권한(시크릿 포함)으로 실행되므로, 포크/봇/이 워크플로우 자신이
# 만든 브랜치가 원인인 경우는 아래 job의 if 조건에서 반드시 걸러야 한다(무한루프·권한 오남용 방지).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: oncall-ci-autofix-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  autofix:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.actor.type != 'Bot' &&
      !startsWith(github.event.workflow_run.head_branch, 'oncall/')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 실패한 잡 로그만 가져오기 + 2차 시크릿 마스킹
        run: |
          set -euo pipefail
          # --log-failed: 실패한 잡의 로그만 가져온다 (성공한 잡·과거 실행 로그는 조회하지 않는다).
          gh run view "${{ github.event.workflow_run.id }}" \
            --repo "${{ github.repository }}" \
            --log-failed > /tmp/ci-failure.raw.log

          # GitHub Actions는 등록된 secrets를 로그 생성 시점에 이미 마스킹하지만,
          # 등록되지 않은 값이 우연히 찍혔을 경우를 대비해 방어적으로 한 번 더 필터링한다.
          sed -E \
            -e 's/(sk-[A-Za-z0-9_-]{10,})/[REDACTED]/g' \
            -e 's/(eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,})/[REDACTED]/g' \
            -e 's/([A-Za-z0-9+\/]{40,}={0,2})/[REDACTED]/g' \
            -e 's/((api[_-]?key|token|secret|password)[=: ]+)[^[:space:]]+/\1[REDACTED]/gI' \
            /tmp/ci-failure.raw.log > /tmp/ci-failure.log
          rm -f /tmp/ci-failure.raw.log
          wc -l /tmp/ci-failure.log

      - name: 수정 브랜치 생성
        run: |
          branch="oncall/ci-fix-${{ github.event.workflow_run.id }}"
          echo "branch=$branch" >> "$GITHUB_ENV"
          git checkout -b "$branch"

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            실패한 CI 실행: ${{ github.event.workflow_run.id }} (브랜치 ${{ github.event.workflow_run.head_branch }}, 커밋 ${{ github.event.workflow_run.head_sha }})
            현재 작업 브랜치: ${{ env.branch }}

            이 실행은 사람이 요청한 게 아니다 — 방금 "CI" 워크플로우(lint/build/test)가 실패한 사실 자체가 트리거인 비대화형 장애 대응(oncall)이다.

            1. /tmp/ci-failure.log 파일 하나만 읽어라. 이 파일에는 실패한 잡의 로그만 들어 있다. 다른 워크플로우 실행이나 과거 로그를 조회하려 하지 마라(애초에 그럴 도구가 허용되어 있지 않다).
            2. 로그를 근거로 근본 원인을 분석하라 (lint 규칙 위반, 타입 에러, 빌드 실패, 실패한 테스트 등).
            3. 원인이 코드에 있고 안전하게 고칠 수 있다면, 문제 해결에 필요한 최소한의 코드만 수정하라. 관련 없는 리팩터링·포맷팅·주석 추가는 하지 마라 (CLAUDE.md의 "surgical changes" 원칙을 따른다).
            4. 수정 후 `npm run lint`, `npm run build`, `npm run test`를 실행해 실제로 통과하는지 스스로 확인하라. (build는 이 스텝의 환경변수로 실행되며, 모두 정적 페이지 수집용 더미 값이다 — 실제 프로덕션 자격증명이 아니다.)
            5. 통과하면 `git add`, `git commit`(conventional commits 형식, 예: `fix(ci): ...`), `git push -u origin ${{ env.branch }}` 로 커밋·푸시하라.
            6. `gh pr create --base main --head ${{ env.branch }} --title "fix(ci): ..." --body-file <파일경로>` 로 PR을 열어라. 절대 병합하거나 승인하지 마라 — gh pr merge, gh api .../reviews 같은 명령은 호출하지 마라 (사람 게이트가 원칙이다).
               PR 본문 최상단에 다음 안내문을 추가하라: "> 🤖 이 PR은 CI 실패(run #${{ github.event.workflow_run.id }})를 감지해 자동으로 생성되었습니다 — 병합 전 반드시 사람이 검토하세요."
               본문에는 (a) 무엇이 왜 깨졌는지, (b) 어떻게 고쳤는지, (c) lint/build/test 재확인 결과를 적어라.
               로그 원문을 그대로 붙여넣지 마라. 필요한 부분만 사람이 읽을 수 있게 요약해서 인용하고, 토큰·키·비밀번호·자격증명처럼 보이는 문자열은 절대 포함하지 마라(짧은 에러 메시지·파일명·라인 번호 정도만 인용).
            7. 배포/운영 환경은 이 작업의 범위가 아니다 — vercel, supabase db push/migration apply 같은 명령은 시도하지 마라 (애초에 이 워크플로우에는 그런 도구가 허용되어 있지 않다). 이 작업은 저장소 코드만 다루는 read-only-for-prod 원칙을 따른다.
            8. PR을 열었다면 그 URL을 저장소 루트의 `.oncall-fix-pr-url.txt` 파일 한 줄에 정확히 Write 툴로 저장하라.
            9. 원인을 찾지 못했거나 자동으로 안전하게 고칠 수 없다고 판단되면(예: 외부 서비스 문제, 설계 판단이 필요한 문제, 로그만으로는 원인 특정 불가) 코드를 수정하거나 PR을 열지 마라. 대신 판단 근거를 `$GITHUB_STEP_SUMMARY` 에 Bash로 append 하라(예: `echo "..." >> "$GITHUB_STEP_SUMMARY"`). 이 경우 8번의 파일은 만들지 마라.
          claude_args: |
            --allowedTools "Read,Write,Edit,Grep,Glob,Bash(npm run lint:*),Bash(npm run build:*),Bash(npm run test:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh pr create:*)"
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"
          SUPABASE_SERVICE_ROLE_KEY: "placeholder-service-role-key"
          ANTHROPIC_API_KEY: "placeholder-anthropic-key"
          POLAR_ACCESS_TOKEN: "placeholder-polar-token"
          POLAR_WEBHOOK_SECRET: "placeholder-webhook-secret"
          POLAR_PRODUCT_ID: "placeholder-product-id"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: "placeholder-posthog-token"
          NEXT_PUBLIC_POSTHOG_HOST: "https://us.i.posthog.com"

      - name: 결과 확인
        run: |
          if [ ! -f .oncall-fix-pr-url.txt ]; then
            echo "::warning::자동 수정 PR이 생성되지 않았습니다 — Job summary를 확인하고 수동으로 조치하세요."
            exit 1
          fi
          echo "PR 생성됨: $(cat .oncall-fix-pr-url.txt)"
